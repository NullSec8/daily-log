name: pr achievements

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of PRs to create"
        default: 1
        type: number
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 2

      - name: randomize next run time
        uses: grbnb/random-workflow-cron@v2
        with:
          workflow_name: ".github/workflows/pr-achievements.yml"
          github_token: ${{ secrets.GH_PAT }}
          push_switch: false
          hour_start: 0
          hour_end: 23
          interval_count: 1

      - name: commit randomized schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .github/workflows/pr-achievements.yml
          git commit -m "chore: randomize schedule"
          git push origin main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: create and merge PRs
        run: |
          git config user.name "NullSec8"
          git config user.email "166947772+NullSec8@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p logs

          COUNT="${{ inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=$((RANDOM % 30 + 1)); fi
          echo "creating $COUNT PRs"

          for i in $(seq 1 "$COUNT"); do
            TS=$(date +%s)
            BRANCH="pr/$TS-$i"
            git checkout -b "$BRANCH"
            echo "Update $i at $(date)" > "logs/log-$TS-$i.txt"
            git add -A
            git commit -m "chore: update $i"
            git push origin "$BRANCH"

            gh pr create --base main --head "$BRANCH" --title "chore: update $i" --body "auto" --fill
            gh pr merge "$BRANCH" --merge --delete-branch

            git checkout main
            git pull --rebase origin main
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}